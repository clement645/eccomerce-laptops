# Render blueprint: ONE free web service. The API runs its own background work (email delivery and
# the payment, stock and blog sweeps) because Render has no free background workers. See
# docs/DEPLOYMENT.md, "Running on Render Free".
# Secrets are `sync: false`: Render asks for them when the blueprint is first applied, and they are
# never stored in this file.
services:
  - type: web
    name: eccomerce-laptops-api
    runtime: docker
    dockerfilePath: ./infrastructure/docker/api.Dockerfile
    dockerContext: .
    plan: free
    # Same region as the Neon database (us-east-2).
    region: ohio
    # Liveness only (no database or Redis call), so a slow dependency can't make Render restart a
    # healthy process. GET /api/v1/health reports dependencies and background jobs.
    healthCheckPath: /api/v1/health/live
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Background jobs run inside this process (no separate worker).
      - key: BACKGROUND_JOBS
        value: inline
      # Render Free has 512 MB: keep the heap well below it (the rest is native memory and buffers).
      - key: NODE_OPTIONS
        value: --max-old-space-size=320
      - key: API_PUBLIC_URL
        value: https://eccomerce-laptops-api.onrender.com
      - key: STOREFRONT_URL
        value: https://eccomerce-laptops.netlify.app
      - key: ADMIN_URL
        value: https://eccomerce-laptops-admin.netlify.app
      - key: CORS_ORIGINS
        value: https://eccomerce-laptops.netlify.app,https://eccomerce-laptops-admin.netlify.app
      - key: STOREFRONT_REVALIDATE_URL
        value: https://eccomerce-laptops.netlify.app/api/revalidate
      # The admin and storefront (netlify.app) are a different site from this API (onrender.com):
      # without this, browsers drop the session and cart cookies and staff are signed out at once.
      # Set to 'false' once everything is on one domain (admin.example.co.ke, api.example.co.ke).
      - key: CROSS_SITE_COOKIES
        value: 'true'
      # One small process: a few connections are enough (Neon's pooler does the rest).
      - key: DATABASE_POOL_MAX
        value: '3'
      - key: REDIS_KEY_PREFIX
        value: ecommerce
      - key: R2_PUBLIC_BUCKET
        value: laptops-media-public
      - key: R2_PRIVATE_BUCKET
        value: laptops-media-private
      - key: R2_PUBLIC_BASE_URL
        value: https://pub-1a4e67cdc47a4ba7b5f38d510c23b318.r2.dev
      - key: MAIL_TRANSPORT
        value: smtp
      # Emails are queued in Redis, so they survive restarts and sleep (see DEPLOYMENT.md).
      - key: MAIL_DELIVERY
        value: queue
      - key: PAYMENTS_SIMULATED
        value: 'false'
      - key: MPESA_ENV
        value: sandbox
      # Secrets, entered in the Render dashboard:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: REVALIDATE_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # Email: add SMTP_HOST, SMTP_PORT, SMTP_SECURE, SMTP_USER, SMTP_PASSWORD and MAIL_FROM here once
      # an email provider is chosen. Until then queued emails are retried and then dropped.
