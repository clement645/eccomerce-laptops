name: Migrate production database

# Applies pending Prisma migrations to Neon. Runs by hand, or when migrations change on main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packages/database/prisma/migrations/**']

permissions:
  contents: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @repo/database...
      - name: Apply migrations
        working-directory: packages/database
        env:
          DB_TARGET: remote
          DIRECT_DATABASE_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate status
