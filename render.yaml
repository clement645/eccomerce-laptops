# Render blueprint: the API (web service) and the background worker, built from one Docker image.
# Secrets are `sync: false`: Render asks for them when the blueprint is first applied, and they are
# never stored in this file. Non-secret settings live in the shared group below.
envVarGroups:
  - name: ecommerce-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: API_PUBLIC_URL
        value: https://eccomerce-laptops-api.onrender.com
      - key: STOREFRONT_URL
        value: https://eccomerce-laptops.netlify.app
      - key: ADMIN_URL
        value: https://eccomerce-laptops-admin.netlify.app
      - key: CORS_ORIGINS
        value: https://eccomerce-laptops.netlify.app,https://eccomerce-laptops-admin.netlify.app
      - key: STOREFRONT_REVALIDATE_URL
        value: https://eccomerce-laptops.netlify.app/api/revalidate
      - key: DATABASE_POOL_MAX
        value: '5'
      - key: REDIS_KEY_PREFIX
        value: ecommerce
      - key: R2_PUBLIC_BUCKET
        value: laptops-media-public
      - key: R2_PRIVATE_BUCKET
        value: laptops-media-private
      - key: R2_PUBLIC_BASE_URL
        value: https://pub-1a4e67cdc47a4ba7b5f38d510c23b318.r2.dev
      - key: MAIL_TRANSPORT
        value: smtp
      - key: MAIL_DELIVERY
        value: queue
      - key: PAYMENTS_SIMULATED
        value: 'false'
      - key: MPESA_ENV
        value: sandbox
      # Secrets, entered in the Render dashboard:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: REVALIDATE_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # Email: add SMTP_HOST, SMTP_PORT, SMTP_SECURE, SMTP_USER, SMTP_PASSWORD and MAIL_FROM to this group
      # once an email provider is chosen. Until then emails are retried by the worker and then dropped.

services:
  - type: web
    name: eccomerce-laptops-api
    runtime: docker
    dockerfilePath: ./infrastructure/docker/api.Dockerfile
    dockerContext: .
    plan: free
    # Same region as the Neon database (us-east-2).
    region: ohio
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - fromGroup: ecommerce-shared

  - type: worker
    name: eccomerce-laptops-worker
    runtime: docker
    dockerfilePath: ./infrastructure/docker/api.Dockerfile
    dockerContext: .
    dockerCommand: node dist/worker.js
    # Background workers have no free plan on Render.
    plan: starter
    region: ohio
    autoDeploy: true
    envVars:
      - fromGroup: ecommerce-shared
